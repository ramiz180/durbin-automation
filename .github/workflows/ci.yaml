name: rBSS-Automations CI
on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: 509399639261.dkr.ecr.eu-west-1.amazonaws.com/bss-automation:latest
          platforms: linux/amd64

      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/docker-bss-automation
            export AWS_PROFILE=bss-automation
            aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 509399639261.dkr.ecr.eu-west-1.amazonaws.com
            docker stop bss-automation
            docker rm bss-automation
            docker rmi 509399639261.dkr.ecr.eu-west-1.amazonaws.com/bss-automation
            docker pull 509399639261.dkr.ecr.eu-west-1.amazonaws.com/bss-automation:latest
            chmod +x startup.sh
            ./startup.sh
